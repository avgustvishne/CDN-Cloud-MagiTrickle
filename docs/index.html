<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDN-Cloud-MagiTrickle — Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#06111f;--panel:#0b1730;--line:#20314a;--text:#e8f1fb;--muted:#91a4ba;--accent:#16b9ff;--ok:#35d07f;--warn:#ffb84d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:20px}
h1{margin:0;font-size:30px}h1 span{color:var(--accent)}h2{font-size:18px;margin:28px 0 14px}a{color:var(--accent)}nav{display:flex;gap:16px;flex-wrap:wrap}
.status{margin:20px 0;padding:12px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px}.dot.stale{background:var(--warn)}.dot.down{background:#f35}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted)}
section{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.bar{display:grid;grid-template-columns:130px 1fr 100px;gap:12px;align-items:center;margin:9px 0}.track{height:10px;background:#14253d;border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:5px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th:last-child,td:last-child,th:nth-child(2),td:nth-child(2){text-align:right}
.err{white-space:pre-wrap;color:var(--warn);background:var(--panel);padding:15px;border-radius:10px}footer{margin-top:25px;color:var(--muted);font-size:13px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header{display:block}.bar{grid-template-columns:95px 1fr 80px}}
</style>
</head>
<body><div class="wrap">
<header><div><h1>CDN-Cloud-<span>MagiTrickle</span></h1><div>Живой статус автоматических CIDR-подписок</div></div>
<nav><a href="https://github.com/avgustvishne/CDN-Cloud-MagiTrickle">Репозиторий</a><a href="https://github.com/avgustvishne/CDN-Cloud-MagiTrickle/blob/main/CHANGELOG.md">Изменения</a><a href="https://github.com/avgustvishne/CDN-Cloud-MagiTrickle/blob/main/config/providers.json">Провайдеры</a></nav></header>
<div class="status"><span id="dot" class="dot"></span><span id="status">Загрузка данных…</span></div>
<div id="content" hidden><div id="stats" class="stats"></div>
<section><h2>Покрытие по провайдерам (IPv4)</h2><div id="providers"></div></section>
<section><h2>Готовые пресеты</h2><table><thead><tr><th>Пресет</th><th>CIDR IPv4</th><th>CIDR IPv6</th></tr></thead><tbody id="presets"></tbody></table></section></div>
<div id="error" hidden class="err"></div><footer id="footer">Данные обновляются автоматически дважды в сутки через GitHub Actions.</footer>
</div>
<script>
const RAW="https://raw.githubusercontent.com/avgustvishne/CDN-Cloud-MagiTrickle/main/";
const labels={full:"Full",balanced:"Balanced",performance:"Performance",minimal:"Minimal",cdn:"CDN",cloud:"Cloud",video:"Video",vpn:"VPN",messaging:"Messaging",stable:"Stable"};
const fmt=n=>new Intl.NumberFormat("ru-RU").format(Math.round(Number(n)||0));
const compact=n=>{n=Number(n)||0;if(n>=1e9)return(n/1e9).toFixed(1).replace(/\.0$/,"")+" млрд";if(n>=1e6)return(n/1e6).toFixed(1).replace(/\.0$/,"")+" млн";if(n>=1e3)return(n/1e3).toFixed(1).replace(/\.0$/,"")+" тыс";return fmt(n)};
const rel=iso=>{const h=(Date.now()-new Date(iso).getTime())/36e5;return h<1?"меньше часа назад":h<24?Math.round(h)+" ч назад":Math.round(h/24)+" дн назад"};
(async()=>{try{
 const stats=await fetch(RAW+"data/statistics.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()});
 const files=stats.files||{}, provider={};
 for(const [p,v] of Object.entries(files)){const m=p.match(/^data\/([a-z0-9-]+)-v4\.txt$/);if(m&&!/^data\/(all-cloud|asn-)/.test(p))provider[m[1]]=v}
 const presets={};for(const[p,v]of Object.entries(files)){let m=p.match(/^data\/presets\/([a-z0-9-]+)-v([46])\.txt$/);if(m)(presets[m[1]]??={})["v"+m[2]]=v}
 const age=(Date.now()-new Date(stats.generated_at).getTime())/36e5;document.getElementById("dot").className="dot"+(age>30?" stale":"");
 document.getElementById("status").textContent="Обновлено "+rel(stats.generated_at)+" · "+stats.generated_at;
 const full4=files["data/presets/full-v4.txt"]||{},full6=files["data/presets/full-v6.txt"]||{};
 document.getElementById("stats").innerHTML=[[compact(full4.ipv4_coverage),"IPv4-адресов (full)"],[fmt(Object.values(provider).reduce((s,p)=>s+(p.cidr_count||0),0)),"CIDR-блоков (провайдеры)"],[fmt(full6.cidr_count),"IPv6-блоков (full)"],[fmt(Object.keys(provider).length),"провайдеров"]].map(x=>'<div class="stat"><b>'+x[0]+'</b><span>'+x[1]+"</span></div>").join("");
 const rows=Object.entries(provider).map(([n,v])=>({n,c:v.ipv4_coverage||0,cidr:v.cidr_count||0})).filter(x=>x.c).sort((a,b)=>b.c-a.c),max=rows[0]?.c||1;
 document.getElementById("providers").innerHTML=rows.map(x=>'<div class="bar"><span>'+x.n+'</span><span class="track"><span class="fill" style="width:'+Math.max(2,100*x.c/max)+'%"></span></span><span>'+compact(x.c)+'</span></div>').join("");
 const order=["full","balanced","performance","minimal","cdn","cloud","video","vpn","messaging","stable"];
 document.getElementById("presets").innerHTML=Object.keys(presets).sort((a,b)=>(order.indexOf(a)+99)-(order.indexOf(b)+99)).map(n=>'<tr><td>'+ (labels[n]||n) +'</td><td>'+fmt(presets[n].v4?.cidr_count)+'</td><td>'+fmt(presets[n].v6?.cidr_count)+'</td></tr>').join("");
 document.getElementById("content").hidden=false;document.getElementById("footer").textContent="Данные обновлены "+rel(stats.generated_at)+" · GitHub Actions каждые 12 часов.";
}catch(e){document.getElementById("dot").className="dot down";document.getElementById("status").textContent="Не удалось загрузить данные";const b=document.getElementById("error");b.hidden=false;b.textContent="Ошибка: "+e.message+"\n"+RAW+"data/statistics.json"} })();
</script></body></html>
