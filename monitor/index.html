<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CDN-Cloud-MagiTrickle — Monitor</title><style>body{font:16px system-ui;margin:2rem;max-width:1000px}table{border-collapse:collapse;width:100%}th,td{padding:.6rem;border-bottom:1px solid #ddd;text-align:left}.ok{color:green}.warn{color:#b8860b}.bad{color:#c00}.muted{color:#777}</style></head><body><h1>CDN-Cloud-MagiTrickle</h1><p>Мониторинг провайдеров · <span id="time">загрузка…</span></p><div id="summary"></div><table><thead><tr><th>Провайдер</th><th>Статус</th><th>Задержка</th><th>HTTP</th></tr></thead><tbody id="rows"></tbody></table><script>
fetch('../data/monitor.json?'+Date.now()).then(r=>r.json()).then(d=>{document.getElementById('time').textContent='Последняя проверка: '+new Date(d.generated_at).toLocaleString();document.getElementById('summary').textContent='🟢 '+d.counts.healthy+'  🟡 '+d.counts.degraded+'  🔴 '+d.counts.down+'  ⚪ '+d.counts.unknown;document.getElementById('rows').innerHTML=d.providers.map(x=>{let cls=x.status==='healthy'?'ok':x.status==='degraded'?'warn':x.status==='down'?'bad':'muted';let icon=x.status==='healthy'?'🟢':x.status==='degraded'?'🟡':x.status==='down'?'🔴':'⚪';return '<tr><td>'+x.provider+'</td><td class="'+cls+'">'+icon+' '+x.status+'</td><td>'+(x.latency_ms==null?'—':x.latency_ms+' ms')+'</td><td>'+(x.http_status||'—')+'</td></tr>'}).join('')}).catch(()=>document.getElementById('time').textContent='Не удалось загрузить статус');</script></body></html>
