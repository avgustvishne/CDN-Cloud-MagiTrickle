name: Service Intelligence

on:
  schedule:
    - cron: "41 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/service-intelligence.yml"
      - "config/services.json"
      - "scripts/service_intelligence.py"
      - "tests/test_service_intelligence.py"

permissions:
  contents: read

concurrency:
  group: magitrickle-service-intelligence
  cancel-in-progress: true

jobs:
  build:
    name: Build service intelligence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The generator commits refreshed service artifacts back to main.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile and test
        run: |
          python -m py_compile scripts/service_intelligence.py
          python -m unittest tests.test_service_intelligence -v

      - name: Build service intelligence
        run: python scripts/service_intelligence.py

      - name: Validate generated service artifacts
        run: |
          python - <<'PY'
          import json
          import pathlib

          report = json.loads(pathlib.Path("data/service-intelligence.json").read_text(encoding="utf-8"))
          assert report["schema_version"] == 1
          assert report["engine"] == "service-intelligence-v1"
          assert set(report["services"]) == {"telegram", "whatsapp", "signal"}
          for name, item in report["services"].items():
              assert item["routing"]["domain_ready"] is True, name
              assert item["routing"]["ip_ready"] is False, name
              assert 0 <= item["confidence"] <= 100, name
              path = pathlib.Path("data/services") / f"{name}-domains.txt"
              assert path.exists() and path.stat().st_size > 0, name
              assert path.read_text(encoding="utf-8").splitlines() == item["domains"], name
          print("Service artifact validation OK")
          PY

      - name: Commit service artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/service-intelligence.json data/services/
          if git diff --cached --quiet; then
            echo "No service changes."
            exit 0
          fi
          git commit -m "chore: update service intelligence"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((attempt * 2)); continue; }
          done
          echo "Unable to publish service intelligence after 5 attempts."
          exit 1
