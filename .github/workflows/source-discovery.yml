name: Source discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Discover candidate repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/source_discovery.py
      - name: Validate report
        run: python -m json.tool data/source-candidates.json >/dev/null
      - name: Commit discovery report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-candidates.json
          git diff --cached --quiet || git commit -m "chore: refresh source discovery report"
          git push
