name: Check subscription links

on:
  push:
    paths:
      - "README.md"
      - "data/**"
      - "scripts/check_links.py"
  pull_request:
    paths:
      - "README.md"
      - "data/**"
      - "scripts/check_links.py"
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Check README Raw links
        run: python scripts/check_links.py
