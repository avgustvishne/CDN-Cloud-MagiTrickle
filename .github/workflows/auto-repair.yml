name: Auto repair Python

on:
  workflow_run:
    workflows: ["Python CI", "Validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout failed branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install repair/test tools
        run: python -m pip install --upgrade pytest ruff

      - name: Safe automatic repairs
        run: |
          ruff check scripts tests --fix
          ruff format scripts tests

      - name: Compile all Python
        run: python -m compileall -q scripts tests

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Commit safe repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts tests
          if git diff --cached --quiet; then
            echo "No safe automatic repair was produced."
            exit 0
          fi
          git commit -m "chore: auto-repair Python formatting and lint"
          git push origin HEAD:${{ github.event.workflow_run.head_branch }}
