name: Publish MagiTrickle status

on:
  workflow_run:
    workflows: ["Update MagiTrickle subscriptions"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "47 */12 * * *"

permissions:
  contents: write

concurrency:
  group: magitrickle-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set status context
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPDATE_EVENT: ${{ github.event.workflow_run.event }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          publication="validated"
          failed_run=""
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$CONCLUSION" != "success" ]; then
              publication="held"
              failed_run="$RUN_URL (conclusion: $CONCLUSION, run: $RUN_ID)"
            elif [ "$UPDATE_EVENT" != "workflow_dispatch" ]; then
              publication="published"
            fi
          fi
          echo "publication=$publication" >> "$GITHUB_OUTPUT"
          echo "failed_run=$failed_run" >> "$GITHUB_OUTPUT"

      - name: Generate status files
        run: |
          python scripts/status_report.py \
            --publication "${{ steps.context.outputs.publication }}" \
            --failed-run "${{ steps.context.outputs.failed_run }}"

      - name: Validate status schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("data/status.json").read_text(encoding="utf-8"))
          assert status["schema_version"] == 1
          assert status["status"] in {"healthy", "degraded", "hold"}
          assert status["publication"] in {"published", "validated", "dry-run", "held"}
          assert isinstance(status["providers"]["items"], list)
          assert isinstance(status["sources"]["total"], int)
          assert isinstance(status["network_evidence"]["queried"], int)
          assert Path("STATUS.md").stat().st_size > 0
          print("Status schema: PASS")
          PY

      - name: Commit status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md data/status.json
          if git diff --cached --quiet; then
            echo "Status unchanged."
            exit 0
          fi
          git commit -m "chore: update autonomous status"
          git push origin HEAD:main
