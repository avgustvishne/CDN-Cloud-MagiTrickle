name: YAML Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install yamllint
        run: python -m pip install --disable-pip-version-check yamllint

      - name: Lint YAML
        run: yamllint -d relaxed .github config
