name: Rollback production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ROLLBACK to restore main from backup/pre-update'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-rollback
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ inputs.confirmation == 'ROLLBACK' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify rollback backup
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup/pre-update:refs/remotes/origin/backup/pre-update
          backup_sha=$(git rev-parse origin/backup/pre-update)
          main_sha=$(git rev-parse origin/main)
          test "$backup_sha" != "$main_sha" || {
            echo "Backup and main already point to the same commit; nothing to roll back."
            exit 1
          }
          echo "Current main: $main_sha"
          echo "Rollback target: $backup_sha"

      - name: Restore main from backup
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach origin/backup/pre-update
          git push --force-with-lease origin HEAD:refs/heads/main
          echo "Production main restored from backup/pre-update."

      - name: Summary
        run: |
          echo "Rollback completed."
          echo "Target: $(git rev-parse HEAD)"
