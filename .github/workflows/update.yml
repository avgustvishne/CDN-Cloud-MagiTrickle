name: Update MagiTrickle V6 subscriptions
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "config/providers.json"
      - "scripts/update_cdn_lists.py"
      - ".github/workflows/update.yml"
permissions:
  contents: write
concurrency:
  group: magitrickle-subscriptions
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Generate V6
        run: python scripts/update_cdn_lists.py
      - name: Validate CIDR and manifests
        run: |
          python - <<'PY'
          import ipaddress, pathlib, json, hashlib
          d=pathlib.Path("data")
          assert (d/"all-cloud-v4.txt").stat().st_size > 0
          for p in d.glob("*.txt"):
            if p.name == "last-update.txt":
              continue
            for line in p.read_text().splitlines():
              ipaddress.ip_network(line)
          m=json.loads((d/"manifest.json").read_text())
          assert m["version"] == 6
          assert m["aggregate"]["ipv4"] > 0
          print("V6 validation OK")
          PY
      - name: Show summary
        run: cat data/last-update.txt
      - name: Commit generated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: V6 update provider subscriptions"
          git push
