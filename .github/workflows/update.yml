name: Update MagiTrickle V22 subscriptions

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "config/providers.json"
      - "scripts/update_cdn_lists.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: magitrickle-subscriptions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate V22
        run: python scripts/update_cdn_lists.py

      - name: Validate V22 data
        run: |
          python - <<'PY'
          import hashlib
          import ipaddress
          import json
          import pathlib

          d = pathlib.Path("data")
          assert (d / "all-cloud-v4.txt").stat().st_size > 0
          assert (d / "all-cloud-v6.txt").exists()

          for p in d.glob("*.txt"):
              if p.name == "last-update.txt":
                  continue
              lines = [x.strip() for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
              assert len(lines) == len(set(lines)), f"duplicate CIDR: {p.name}"
              expected_version = 6 if p.name.endswith("-v6.txt") else 4
              for line in lines:
                  n = ipaddress.ip_network(line)
                  assert n.version == expected_version, f"wrong IP version: {line} in {p.name}"
                  assert n.is_global, f"non-global prefix: {line} in {p.name}"
                  assert n.prefixlen >= (8 if n.version == 4 else 16), f"broad prefix: {line} in {p.name}"

          cfg = json.loads(pathlib.Path("config/providers.json").read_text(encoding="utf-8"))
          provider_names = set(cfg["providers"])
          generated_names = {p.name[:-7] for p in d.glob("*-v4.txt") if p.name != "all-cloud-v4.txt"}
          assert generated_names == provider_names, f"provider files mismatch: generated={sorted(generated_names)} config={sorted(provider_names)}"
          for obsolete in ("cdn-cloud-v4.txt", "cdn-cloud-v6.txt", "dpi-recommended-v4.txt", "dpi-recommended-v6.txt"):
              assert not (d / obsolete).exists(), f"obsolete file remains: {obsolete}"

          m = json.loads((d / "manifest.json").read_text(encoding="utf-8"))
          assert m["version"] == 22
          assert m["global_only"] is True
          assert m["min_prefixlen"] == {"ipv4": 8, "ipv6": 16}
          assert m["aggregate"]["ipv4"] > 0
          assert m["aggregate"]["ipv6"] >= 0

          checks = (d / "checksums.sha256").read_text(encoding="utf-8").splitlines()
          assert checks
          for row in checks:
              digest, rel = row.split("  ", 1)
              p = pathlib.Path(rel)
              assert p.exists(), rel
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest, f"checksum mismatch: {rel}"

          print("V22 validation OK")
          PY

      - name: Show summary
        run: cat data/last-update.txt

      - name: Commit generated lists
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: V22 update provider subscriptions"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi

            echo "Push was not a fast-forward; refreshing main (attempt ${attempt})."
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Rebase failed on attempt ${attempt}."
              sleep $((attempt * 2))
              continue
            }
          done

          echo "Unable to push generated V22 data after 5 attempts."
          exit 1
