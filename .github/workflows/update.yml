name: Update MagiTrickle V3 subscriptions
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "config/providers.json"
      - "scripts/update_cdn_lists.py"
      - ".github/workflows/update.yml"
permissions:
  contents: write
concurrency:
  group: magitrickle-subscriptions
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate
        run: python scripts/update_cdn_lists.py
      - name: Validate
        run: |
          python - <<'PY'
          import ipaddress,pathlib
          files=list(pathlib.Path("data").glob("*.txt"))
          assert pathlib.Path("data/aws-v4.txt").stat().st_size > 0
          assert pathlib.Path("data/cloudflare-v4.txt").stat().st_size > 0
          for p in files:
            if p.name=="last-update.txt": continue
            for line in p.read_text().splitlines(): ipaddress.ip_network(line)
          print("CIDR validation OK")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "chore: V3 update provider subscriptions"
          git push
