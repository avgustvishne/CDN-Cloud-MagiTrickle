name: Update MagiTrickle subscriptions

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "config/providers.json"
      - "config/source_registry.json"
      - "scripts/update_cdn_lists.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: magitrickle-subscriptions
  cancel-in-progress: true

jobs:
  dpi-health:
    name: DPI health probe (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run DPI detector if installed
        run: |
          if command -v dpi_detector >/dev/null 2>&1; then
            python3 scripts/dpi_probe.py --detector dpi_detector --tests 123 --concurrency 20 --allow-fail
          else
            echo '{"status":"UNAVAILABLE","reason":"DPI detector is intentionally not installed on the GitHub runner; run this probe on the target network."}' > data/dpi-health.json
          fi
      - name: Discover provider ASNs and current prefixes
        run: |
          python3 scripts/discover_provider_asns.py
      - name: Build normalized CIDR provenance
        run: |
          mkdir -p data/evidence
          python3 scripts/provenance.py
      - name: Validate source health
        run: |
          python3 scripts/source_health.py
      - name: Generate FULL BALANCED MINIMAL profiles
        run: |
          python3 scripts/profile_generator.py
          python3 scripts/validate_profiles.py
      - name: Generate update report
        run: |
          python3 scripts/update_report.py
      - name: Run publication regression gate
        run: |
          python3 scripts/regression.py --current data/provenance/cidr.json --output data/health/regression.json
      - name: Build DPI source registry and quality report
        run: |
          python3 scripts/dpi_sources.py
          python3 scripts/dpi_quality.py --input data/dpi/observations.json
      - name: Build DPI matrix and strategy audit
        run: |
          python3 scripts/dpi_matrix.py
          python3 scripts/dpi_strategy_audit.py
      - name: Upload DPI matrix
        uses: actions/upload-artifact@v4
        with:
          name: dpi-matrix
          path: data/dpi/
      - name: Upload DPI health report
        uses: actions/upload-artifact@v4
        with:
          name: dpi-health
          path: data/dpi-health.json
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Run generator unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Generate subscriptions
        run: python scripts/update_cdn_lists.py

      - name: Generate change summary
        run: python scripts/diff_summary.py

      - name: Generate release notes
        run: python scripts/release_notes.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import hashlib
          import ipaddress
          import json
          import pathlib

          d = pathlib.Path("data")
          assert (d / "all-cloud-v4.txt").stat().st_size > 0
          assert (d / "all-cloud-v6.txt").exists()
          assert (d / "asn-all-v4.txt").stat().st_size > 0
          assert (d / "asn-all-v6.txt").exists()

          for p in list(d.glob("*.txt")) + list((d / "presets").glob("*.txt")):
              if p.name == "last-update.txt":
                  continue
              lines = [x.strip() for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
              assert len(lines) == len(set(lines)), f"duplicate CIDR: {p.name}"
              expected_version = 6 if p.name.endswith("-v6.txt") else 4
              for line in lines:
                  n = ipaddress.ip_network(line)
                  assert n.version == expected_version, f"wrong IP version: {line} in {p.name}"
                  assert n.is_global, f"non-global prefix: {line} in {p.name}"
                  assert n.prefixlen >= (8 if n.version == 4 else 16), f"broad prefix: {line} in {p.name}"

          cfg = json.loads(pathlib.Path("config/providers.json").read_text(encoding="utf-8"))
          provider_names = set(cfg["providers"])
          generated_names = {p.name[:-7] for p in d.glob("*-v4.txt") if p.name not in ("all-cloud-v4.txt", "asn-all-v4.txt", "asn-confirmed-v4.txt")}
          assert generated_names == provider_names, f"provider files mismatch: generated={sorted(generated_names)} config={sorted(provider_names)}"
          for obsolete in ("cdn-cloud-v4.txt", "cdn-cloud-v6.txt", "dpi-recommended-v4.txt", "dpi-recommended-v6.txt", "lite-v4.txt", "lite-v6.txt"):
              assert not (d / obsolete).exists(), f"obsolete file remains: {obsolete}"
          required_profiles = [
              "full-v4.txt", "full-v6.txt",
              "balanced-v4.txt", "balanced-v6.txt",
              "minimal-v4.txt", "minimal-v6.txt",
              "cdn-v4.txt", "cdn-v6.txt",
              "cloud-v4.txt", "cloud-v6.txt",
              "video-v4.txt", "video-v6.txt",
              "vpn-v4.txt", "vpn-v6.txt",
          ]
          for name in required_profiles:
              p = d / "presets" / name
              assert p.exists() and p.stat().st_size > 0, f"missing/empty profile: {name}"

          summary = json.loads((d / "change-summary.json").read_text(encoding="utf-8"))
          assert isinstance(summary.get("datasets"), dict)
          notes = (d / "release-notes.md").read_text(encoding="utf-8")
          assert notes.startswith("# Subscription update — v")

          m = json.loads((d / "manifest.json").read_text(encoding="utf-8"))
          assert m["global_only"] is True
          assert m["engine"] == "final-v43-wide-source-fusion"
          assert m.get("min_provider_prefixes") is None
          assert m.get("max_provider_prefixes") is None
          overlaps = json.loads((d / "provider-overlaps.json").read_text(encoding="utf-8"))
          assert isinstance(overlaps.get("entries"), list)
          assert overlaps.get("exact_cross_provider_overlaps", 0) >= 0
          assert m["min_prefixlen"] == {"ipv4": 8, "ipv6": 16}
          assert m["aggregate"]["ipv4"] > 0
          assert m["aggregate"]["ipv6"] >= 0

          checks = (d / "checksums.sha256").read_text(encoding="utf-8").splitlines()
          assert checks
          for row in checks:
              digest, rel = row.split("  ", 1)
              p = pathlib.Path(rel)
              assert p.exists(), rel
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest, f"checksum mismatch: {rel}"

          # Cross-provider overlaps are audited separately; they are not duplicate
          # lines inside a single subscription and must not be silently deleted.
          print("Validation OK: syntax, CIDR uniqueness, provider coverage, profiles, checksums and overlap audit")
          PY

      - name: Show summary
        run: cat data/last-update.txt

      - name: Commit generated lists
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update provider subscriptions"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt ${attempt}."
              exit 0
            fi

            echo "Push was not a fast-forward; refreshing main (attempt ${attempt})."
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Rebase failed on attempt ${attempt}."
              sleep $((attempt * 2))
              continue
            }
          done

          echo "Unable to push generated data after 5 attempts."
          exit 1
