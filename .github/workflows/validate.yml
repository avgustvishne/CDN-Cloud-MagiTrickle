name: Validate subscriptions

on:
  pull_request:
    paths:
      - "data/**"
      - "config/**"
      - "scripts/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Compile Python
        run: python -m compileall -q scripts
      - name: Validate published CIDR files
        run: python scripts/validate_subscriptions.py
