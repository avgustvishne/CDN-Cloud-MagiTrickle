name: Validate subscriptions

on:
  pull_request:
    paths:
      - "data/**"
      - "config/**"
      - "scripts/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q scripts
      - name: Validate published CIDR files
        run: python scripts/validate_subscriptions.py
