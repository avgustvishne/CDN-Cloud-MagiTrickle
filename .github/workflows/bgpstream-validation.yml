name: BGPKIT live validation

on:
  schedule:
    - cron: "47 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgp-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install current BGPKIT stack
        run: |
          set -euo pipefail
          python3 -m venv /tmp/bgpkit-venv
          /tmp/bgpkit-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            "pybgpkit==0.8.0"

      - name: Run BGPKIT validation
        run: |
          set -euo pipefail
          /tmp/bgpkit-venv/bin/python scripts/bgpstream_validate.py --hours 0.5 --limit 12 --files 12

      - name: Validate report
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          p = pathlib.Path("data/bgpstream-health.json")
          x = json.loads(p.read_text(encoding="utf-8"))
          assert x["source"] == "BGPKIT Broker + BGPKIT Parser"
          assert x["record_type"] == "updates"
          assert x["sample_size"] > 0
          assert x["files_parsed"] > 0
          assert x["elements_observed"] >= 0
          assert isinstance(x["results"], list)
          print("BGPKIT validation report OK")
          PY

      - name: Commit validation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bgpstream-health.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: refresh BGPKIT validation"
          git push
