name: BGPStream live validation

on:
  schedule:
    - cron: "47 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bgpstream-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Run CAIDA BGPStream validation
        run: |
          set -euo pipefail
          docker pull caida/bgpstream:latest
          docker run --rm \
            -v "$PWD:/repo" \
            caida/bgpstream:latest \
            python3 /repo/scripts/bgpstream_validate.py --hours 0.5 --limit 12

      - name: Validate report
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/bgpstream-health.json")
          x = json.loads(p.read_text())
          assert x["source"] == "CAIDA BGPStream"
          assert x["record_type"] == "updates"
          assert x["sample_size"] > 0
          assert x["elements_observed"] >= 0
          assert isinstance(x["results"], list)
          print("BGPStream validation report OK")
          PY

      - name: Commit validation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bgpstream-health.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: refresh BGPStream validation"
          git push
