name: Python tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
