name: Python CI

on:
  push:
    branches: ["main", "restore/monolithic-engine"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Run generator unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate generator syntax and imports
        run: |
          python - <<'PY'
          import ast, pathlib
          for p in pathlib.Path("scripts").glob("*.py"):
              ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
              print("OK", p)
          PY
