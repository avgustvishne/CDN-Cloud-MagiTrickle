name: Generate MagiTrickle profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */12 * * *"
  push:
    paths:
      - "scripts/generate_profiles.py"
      - ".github/workflows/profiles.yml"

permissions:
  contents: write

concurrency:
  group: magitrickle-profiles
  cancel-in-progress: false

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate profiles
        run: python scripts/generate_profiles.py

      - name: Validate profiles
        run: |
          python - <<'PY'
          import ipaddress, pathlib
          d = pathlib.Path("data/presets")
          required = [
            "full-v4.txt", "full-v6.txt",
            "balanced-v4.txt", "balanced-v6.txt",
            "minimal-v4.txt", "minimal-v6.txt",
            "cdn-v4.txt", "cdn-v6.txt",
            "cloud-v4.txt", "cloud-v6.txt",
            "video-v4.txt", "video-v6.txt",
            "vpn-v4.txt", "vpn-v6.txt",
          ]
          for name in required:
              p = d / name
              assert p.exists() and p.stat().st_size > 0, f"missing/empty: {name}"
              lines = [x.strip() for x in p.read_text().splitlines() if x.strip()]
              assert len(lines) == len(set(lines)), f"duplicate: {name}"
              version = 6 if name.endswith("-v6.txt") else 4
              for line in lines:
                  n = ipaddress.ip_network(line, strict=False)
                  assert n.version == version
                  assert n.is_global
          print("Profile validation OK")
          PY

      - name: Commit profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/presets/
          if git diff --cached --quiet; then
            echo "No profile changes."
            exit 0
          fi
          git commit -m "chore: update MagiTrickle profiles"
          git push
