name: Rollback Guard

on:
  workflow_run:
    workflows: ["Update MagiTrickle subscriptions"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - "data/**/*.txt"
      - "scripts/rollback_guard.py"
      - ".github/workflows/rollback-guard.yml"

permissions:
  contents: read

jobs:
  guard:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check generated datasets
        run: |
          python scripts/rollback_guard.py data --previous-ref HEAD^ --report "$RUNNER_TEMP/rollback-report.json"
      - name: Report rollback decision
        run: |
          if git diff --quiet -- data; then
            echo "Rollback guard: no rollback required."
          else
            echo "Rollback guard detected a dataset change that would require manual review."
            git diff --stat -- data
            exit 1
          fi
