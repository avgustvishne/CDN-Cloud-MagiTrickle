name: Rollback Guard

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**/*.txt"
      - "scripts/rollback_guard.py"
      - ".github/workflows/rollback-guard.yml"

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check generated datasets
        run: |
          python scripts/rollback_guard.py data --previous-ref HEAD^ --report "$RUNNER_TEMP/rollback-report.json"
      - name: Commit automatic rollback
        if: success()
        run: |
          if git diff --quiet -- data; then
            echo "No rollback required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: automatic dataset rollback [skip ci]"
            git push
          fi
