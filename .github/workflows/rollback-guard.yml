name: Rollback Guard

on:
  workflow_dispatch:
  push:
    paths:
      - "data/**/*.txt"
      - "scripts/rollback_guard.py"
      - ".github/workflows/rollback-guard.yml"

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run rollback guard
        run: |
          mkdir -p .snapshots
          python scripts/rollback_guard.py data .snapshots --restore --report data/rollback-report.json
      - name: Commit restored data/report
        if: success()
        run: |
          if git diff --quiet; then
            echo "No rollback changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: restore last healthy dataset"
            git push
          fi
