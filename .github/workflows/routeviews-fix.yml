name: Apply RouteViews client migration

on:
  push:
    branches: [fix/routeviews-rate-limit]
    paths:
      - .github/workflows/routeviews-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace bursty RouteViews implementations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("scripts/update_cdn_lists.py"),
              Path("scripts/source_acquisition.py"),
          ]
          replacement = "from routeviews_client import routeviews_prefixes\n\n"
          pattern = re.compile(r"^def routeviews_prefixes\\(asn\\):.*?(?=^def [A-Za-z_]\\w*\\(", re.M | re.S)
          changed = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              new_text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"expected exactly one routeviews_prefixes function in {path}, found {count}")
              if new_text == text:
                  continue
              path.write_text(new_text, encoding="utf-8")
              changed.append(str(path))
          if changed:
              print("Patched:", ", ".join(changed))
          else:
              print("Already patched")
          PY

          python -m py_compile scripts/update_cdn_lists.py scripts/source_acquisition.py scripts/routeviews_client.py tests/test_routeviews_client.py
          python -m unittest tests.test_routeviews_client -v

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_cdn_lists.py scripts/source_acquisition.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: route RouteViews through throttled client"
            git push
          fi
