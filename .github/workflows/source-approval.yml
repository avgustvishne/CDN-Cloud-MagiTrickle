name: Source approval gate

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1"

permissions:
  contents: write

jobs:
  approval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run approval gate
        run: python scripts/source_approval.py
      - name: Validate report
        run: python -m json.tool data/source-approval.json >/dev/null
      - name: Commit approval report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-approval.json
          git diff --cached --quiet || git commit -m "chore: refresh source approval report"
          git push
